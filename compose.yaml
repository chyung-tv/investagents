name: agent-investment-forum

services:
  migrate:
    build:
      context: ./web
      target: migrate
    env_file: ./web/.env
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  web:
    build:
      context: ./web
      target: web-dev
    env_file: ./web/.env
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./worker
      target: worker-dev
    env_file: ./worker/.env
    init: true
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./worker/src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  web_node_modules:
